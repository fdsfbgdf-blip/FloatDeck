<div id="fdeditor">
<p><b>人物遮罩可视化修正 · 所有结果未通过审核</b></p>
<p>先选编辑起点；拖动“修正框”，再用绿/红画笔标记人物/背景。点“重新修正”，预览三个局部结果后点“保留当前修正”。框外像素保持不变。</p>
<div id="buttons"></div>
<label>工具 <select id="mode"><option value="roi">修正框</option><option value="1">人物画笔（绿）</option><option value="0">背景画笔（红）</option></select></label>
<label>笔半径 <input id="radius" type="range" min="1" max="40" value="4"></label>
<label>放大 <input id="zoom" type="range" min="25" max="200" value="35"></label>
<label>显示 <select id="view"><option value="overlay">透明叠加</option><option value="source">完整原图</option><option value="mask">当前遮罩</option><option value="before">修正前对照</option></select></label>
<p id="status">正在加载素材…</p><div style="overflow:auto;max-height:800px;border:1px solid #777"><canvas id="canvas" width="1648" height="2944" style="touch-action:none"></canvas></div></div>
<script>
(async()=>{
const root=document.getElementById('fdeditor'),c=root.querySelector('#canvas'),ctx=c.getContext('2d'),status=root.querySelector('#status');
let source=new Image(),mask=null,before=null,roi=null,strokes=[],active=null,drag=null,proposal=null,busy=false;
const load=url=>new Promise(resolve=>{if(!url)return resolve(null);let im=new Image();im.onload=()=>resolve(im);im.src=url});
function draw(){c.style.width=(1648*root.querySelector('#zoom').value/100)+'px';ctx.clearRect(0,0,1648,2944);ctx.drawImage(source,0,0);const v=root.querySelector('#view').value,m=v==='before'?before:mask;
if(m&&v!=='source'){if(v==='mask')ctx.drawImage(m,0,0);else{let t=document.createElement('canvas');t.width=1648;t.height=2944;let x=t.getContext('2d');x.drawImage(m,0,0);let d=x.getImageData(0,0,1648,2944);for(let i=0;i<d.data.length;i+=4){let a=d.data[i];d.data[i]=255;d.data[i+1]=30;d.data[i+2]=140;d.data[i+3]=a*.45}x.putImageData(d,0,0);ctx.drawImage(t,0,0)}}
if(roi){ctx.strokeStyle='yellow';ctx.lineWidth=4;ctx.strokeRect(roi[0],roi[1],roi[2]-roi[0],roi[3]-roi[1])}
for(let s of strokes){ctx.strokeStyle=s.label?'lime':'red';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=s.radius*2;ctx.lineCap='round';ctx.beginPath();s.points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();for(let p of s.points){ctx.beginPath();ctx.arc(...p,s.radius,0,Math.PI*2);ctx.fill()}}}
async function call(action,data={}){if(busy)return;busy=true;status.textContent='处理中，请等待（SAM修正可能需要一些时间）…';try{let r=await google.colab.kernel.invokeFunction('floatdeck.editor',[action,data],{});let value=r.data['application/json'];if(value.error){status.textContent=value.error;return}if(value.zip){status.textContent='审核ZIP已导出并下载；仍未人工通过。';return}source=await load(value.source);mask=await load(value.mask);if(action!=='preview')before=mask;if(value.draft){roi=value.draft.roi;strokes=value.draft.strokes||[]}status.textContent='已保存进度。人物未通过；珍珠2锁定。';draw()}catch(e){status.textContent='操作失败，请下载诊断包后发送。'}finally{busy=false}}
function button(label,fn){let b=document.createElement('button');b.textContent=label;b.style.margin='4px';b.onclick=fn;root.querySelector('#buttons').appendChild(b)}
for(let i=0;i<3;i++)button('以组合'+i+'开始编辑',()=>call('select',{index:i}));
button('重新修正',async()=>{proposal=null;await call('propose',{roi,strokes})});
for(let i=0;i<3;i++)button('预览修正'+i,async()=>{proposal=i;await call('preview',{preview:i})});
button('保留当前修正',async()=>{if(proposal===null){status.textContent='先预览一个局部候选';return}await call('apply',{index:proposal});proposal=null;strokes=[];draw()});
button('撤销修正',()=>call('undo'));button('恢复修正',()=>call('redo'));
button('撤销一笔',()=>{strokes.pop();draw();call('draft',{roi,strokes})});
button('导出审核ZIP（同时备份进度）',()=>call('export'));
const pos=e=>{let b=c.getBoundingClientRect();return [Math.max(0,Math.min(1647,Math.round((e.clientX-b.left)*1648/b.width))),Math.max(0,Math.min(2943,Math.round((e.clientY-b.top)*2944/b.height)))]};
c.onpointerdown=e=>{if(busy)return;c.setPointerCapture(e.pointerId);let p=pos(e);if(root.querySelector('#mode').value==='roi'){drag=p;roi=[...p,p[0]+1,p[1]+1]}else{active={label:+root.querySelector('#mode').value,radius:+root.querySelector('#radius').value,points:[p]};strokes.push(active)}draw()};
c.onpointermove=e=>{if(busy)return;let p=pos(e);if(drag)roi=[Math.min(p[0],drag[0]),Math.min(p[1],drag[1]),Math.max(p[0],drag[0])+1,Math.max(p[1],drag[1])+1];if(active)active.points.push(p);if(drag||active)draw()};
c.onpointerup=()=>{drag=null;active=null;call('draft',{roi,strokes})};root.querySelector('#zoom').oninput=draw;root.querySelector('#view').onchange=draw;
await call('view');
})();
</script>
