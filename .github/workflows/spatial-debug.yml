name: Spatial Debug APK
on:
  push:
    branches: [spatial-v1, spatial-render-diagnostics, spatial-render-fix-v2, spatial-render-fix-v3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # setup-android defaults to obsolete SDK package "tools".
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools libegl1 libgl1 libgl1-mesa-dri
      - name: Install color regression dependencies
        run: python3 -m pip install numpy Pillow
      - name: Normal color screenshots and GPU timings
        run: python3 scripts/spatial-color-regression.py
      - name: Exact ray GPU regression
        run: python3 scripts/spatial-ray-regression.py
      - name: Build original sample packages
        run: |
          python3 scripts/build-spatial-samples.py samples/spatial
          python3 scripts/build-spatial-diagnostics.py samples/spatial
          python3 scripts/build-spatial-v13.py samples/spatial
      - name: Test, validate shaders and build
        run: ./gradlew testDebugUnitTest validateShaders assembleDebug
      # AGP 9.1.1/Kotlin FIR currently crashes in several lint detectors.
      # Keep results visible without blocking the independently verified APK.
      - name: Android Lint (toolchain compatibility diagnostic)
        continue-on-error: true
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FloatDeck-Spatial-Render-Fix-V3
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            samples/spatial/*.zip
            SPATIAL_PACKAGE_FORMAT.md
            SPATIAL_V1_1.md
            SPATIAL_DIAGNOSTICS.md
            SPATIAL_V1_2.md
            SPATIAL_STRENGTH_2X.md
            SPATIAL_V1_3.md
            SPATIAL_APP_DIAGNOSTIC_STEP1.md
            SPATIAL_RENDER_FIX_V2.md
            SPATIAL_RENDER_FIX_V3.md
            work/v3-gpu/

  android-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM for the disposable test emulator
        run: sudo chmod 666 /dev/kvm
      - name: Android package import and player lifecycle tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew assembleDebug assembleDebugAndroidTest
            # Compilation can outlast the emulator display timeout. Ordinary input only.
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent KEYCODE_MENU
            ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.floatdeck.spatial.SpatialPlayerIntegrationTest,app.floatdeck.spatial.SpatialGpuDiagnosticTest,app.floatdeck.spatial.SpatialDiagnosticLifecycleTest,app.floatdeck.spatial.SpatialRenderABTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            adb exec-out run-as app.floatdeck.dev cat cache/spatial-preview.png > spatial-preview.png
            mkdir -p work/android-smoke
            adb exec-out run-as app.floatdeck.dev cat cache/strength-comparison.csv > work/android-smoke/strength-comparison.csv
            cat work/android-smoke/strength-comparison.csv
            adb exec-out run-as app.floatdeck.dev cat cache/render-diagnostics.csv > work/android-smoke/render-diagnostics.csv
            cat work/android-smoke/render-diagnostics.csv
            adb exec-out run-as app.floatdeck.dev cat cache/v3-comparison.zip > work/android-smoke/v3-comparison.zip
            python3 scripts/check-spatial-android-flow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FloatDeck-Spatial-Render-Fix-V3-Android-tests
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            spatial-preview.png
            work/android-smoke/
