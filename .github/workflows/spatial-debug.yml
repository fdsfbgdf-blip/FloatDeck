name: Spatial Debug APK
on:
  push:
    branches: [spatial-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spatial-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install shader validator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools
      - name: Test, validate shaders and build
        run: ./gradlew testDebugUnitTest validateShaders assembleDebug
      # AGP 9.1.1/Kotlin FIR currently crashes in several lint detectors.
      # Keep results visible without blocking the independently verified APK.
      - name: Android Lint (toolchain compatibility diagnostic)
        continue-on-error: true
        run: ./gradlew lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FloatDeck-Spatial-V1-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
