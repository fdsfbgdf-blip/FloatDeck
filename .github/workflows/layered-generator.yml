name: Layered V4 Generator CPU Checks
on:
  push:
    branches: [spatial-layered-v4-generator]
  pull_request:
    paths: ['tools/layered_v4/**', 'notebooks/FloatDeck_V4_Layered_Generator.ipynb', 'scripts/check-layered-notebook.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-and-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: CPU dependencies only, no GPU models
        run: python -m pip install numpy==1.26.4 scipy==1.15.1 Pillow==11.1.0 nbformat==5.10.4
      - name: Syntax and strict notebook format
        run: |
          python -m compileall -q tools/layered_v4
          python scripts/check-layered-notebook.py --require-nbformat
      - name: CPU image math, safety, review gates and schema fixture
        env:
          FLOATDECK_SCHEMA_FIXTURE: work/v4/SYNTHETIC_SCHEMA_ONLY.spatial-v2.zip
        run: |
          python -m unittest -v tools.layered_v4.test_generator
          python -m tools.layered_v4.validate work/v4/SYNTHETIC_SCHEMA_ONLY.spatial-v2.zip --allow-draft
      - uses: actions/upload-artifact@v4
        with:
          name: FloatDeck-V4-Generator-CPU-Checked-NOT-Model-Validated
          path: |
            notebooks/FloatDeck_V4_Layered_Generator.ipynb
            tools/layered_v4/
            !tools/layered_v4/__pycache__/**
            work/v4/SYNTHETIC_SCHEMA_ONLY.spatial-v2.zip
            SPATIAL_V4_GENERATOR_REPORT.md
